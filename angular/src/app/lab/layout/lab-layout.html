<gns-theme-provider>
  <div class="gns-lab-layout">
    <div class="gns-lab-layout__topbar">
      <span
        style="
          font-family: var(--gns-font-display);
          font-size: var(--gns-text-xl);
          font-weight: var(--gns-font-weight-bold);
          color: var(--gns-color-text-primary);
          letter-spacing: var(--gns-tracking-wide);
        "
      >
        <span style="color: var(--gns-ouro-500)">&#x0950;</span> Ganesha Design Lab
      </span>
      <div style="margin-left: auto; display: flex; align-items: center; gap: var(--gns-space-3)">
        <span style="font-size: var(--gns-text-sm); color: var(--gns-color-text-secondary)">
          {{ themeService.currentTheme() === 'dark' ? 'Dark' : 'Light' }}
        </span>
        <gns-switch [value]="isDarkTheme()" (valueChange)="handleThemeToggle($event)" />
      </div>
    </div>

    <div class="gns-lab-layout__sidebar">
      <!-- Home -->
      <div class="gns-lab-nav__group">
        <a class="gns-lab-nav__item" routerLink="/lab" [routerLinkActive]="['is-active']">Home</a>
      </div>

      <!-- Foundations -->
      <div class="gns-lab-nav__group">
        <div class="gns-lab-nav__group-label">Foundations</div>
        <a class="gns-lab-nav__item" routerLink="/lab/colors" [routerLinkActive]="['is-active']">Colors</a>
        <a class="gns-lab-nav__item" routerLink="/lab/typography" [routerLinkActive]="['is-active']">Typography</a>
        <a class="gns-lab-nav__item" routerLink="/lab/spacing" [routerLinkActive]="['is-active']">Spacing</a>
        <a class="gns-lab-nav__item" routerLink="/lab/shadows" [routerLinkActive]="['is-active']">Shadows</a>
      </div>

      <!-- Components -->
      <div class="gns-lab-nav__group">
        <div class="gns-lab-nav__group-label">Components</div>
        <a class="gns-lab-nav__item" routerLink="/lab/buttons" [routerLinkActive]="['is-active']">Buttons</a>
        <a class="gns-lab-nav__item" routerLink="/lab/forms" [routerLinkActive]="['is-active']">Forms</a>
        <a class="gns-lab-nav__item" routerLink="/lab/data-display" [routerLinkActive]="['is-active']">Data Display</a>
        <a class="gns-lab-nav__item" routerLink="/lab/feedback" [routerLinkActive]="['is-active']">Feedback</a>
        <a class="gns-lab-nav__item" routerLink="/lab/navigation" [routerLinkActive]="['is-active']">Navigation</a>
        <a class="gns-lab-nav__item" routerLink="/lab/surfaces" [routerLinkActive]="['is-active']">Surfaces</a>
        <a class="gns-lab-nav__item" routerLink="/lab/overlays" [routerLinkActive]="['is-active']">Overlays</a>
        <a class="gns-lab-nav__item" routerLink="/lab/charts" [routerLinkActive]="['is-active']">Charts</a>
        <a class="gns-lab-nav__item" routerLink="/lab/grid" [routerLinkActive]="['is-active']">Grid &amp; Layout</a>
      </div>

      <!-- Patterns -->
      <div class="gns-lab-nav__group">
        <div class="gns-lab-nav__group-label">Patterns</div>
        <a class="gns-lab-nav__item" routerLink="/lab/dashboard" [routerLinkActive]="['is-active']">Dashboard</a>
        <a class="gns-lab-nav__item" routerLink="/lab/table-page" [routerLinkActive]="['is-active']">Table Page</a>
        <a class="gns-lab-nav__item" routerLink="/lab/form-page" [routerLinkActive]="['is-active']">Form Page</a>
        <a class="gns-lab-nav__item" routerLink="/lab/profile" [routerLinkActive]="['is-active']">Profile Page</a>
        <a class="gns-lab-nav__item" routerLink="/lab/auth" [routerLinkActive]="['is-active']">Auth Page</a>
      </div>
    </div>

    <div class="gns-lab-layout__content">
      <router-outlet />
    </div>
  </div>
</gns-theme-provider>

<gns-toast-container />
