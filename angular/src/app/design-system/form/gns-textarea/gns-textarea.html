<div [class]="wrapperClass()">
  @if (label()?.trim()) {
    <label class="gns-textarea__label" [attr.for]="textareaId">
      {{ label() }}
      @if (isRequired()) {
        <span class="gns-textarea__required" aria-hidden="true">*</span>
      }
    </label>
  }

  <textarea
    [id]="textareaId"
    [class]="textareaClass()"
    [rows]="rows()"
    [attr.placeholder]="placeholder()"
    [disabled]="disabled()"
    [required]="isRequired()"
    [attr.aria-required]="isRequired()"
    [attr.aria-invalid]="hasError()"
    [attr.aria-describedby]="describedBy()"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  >{{ innerValue() }}</textarea>

  @if (hasError()) {
    <span [id]="errorId" class="gns-textarea__error" role="alert">
      {{ errorMessage() }}
    </span>
  } @else if (helperText()?.trim()) {
    <span [id]="helperId" class="gns-textarea__helper">
      {{ helperText() }}
    </span>
  }
</div>
