<div [class]="cssClass()">
    @if (headerContent()) {
        <div class="gns-card__header">
            <ng-content select="[header]"></ng-content>
        </div>
    }
    <div class="gns-card__body">
        <ng-content></ng-content>
    </div>
    @if (footerContent()) {
        <div class="gns-card__footer">
            <ng-content select="[footer]"></ng-content>
        </div>
    }
</div>
