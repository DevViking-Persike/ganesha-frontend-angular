<div [class]="cssClass()" role="img" aria-label="Line chart">
    @if (vm(); as chart) {
        <svg class="gns-line-chart__svg"
             [attr.viewBox]="'0 0 ' + chart.viewW + ' ' + chart.viewH"
             xmlns="http://www.w3.org/2000/svg"
             [attr.width]="chart.viewW"
             [attr.height]="chart.viewH">

            @if (areaGradients().length > 0) {
                <defs>
                    @for (grad of areaGradients(); track grad.id) {
                        <linearGradient [attr.id]="grad.id" x1="0" x2="0" y1="0" y2="1">
                            <stop offset="0%" [attr.stop-color]="grad.color" stop-opacity="0.6" />
                            <stop offset="100%" [attr.stop-color]="grad.color" stop-opacity="0.0" />
                        </linearGradient>
                    }
                </defs>
            }

            @for (grid of chart.gridH; track $index) {
                <line class="gns-line-chart__grid-h"
                      [attr.x1]="chart.paddingLeft"
                      [attr.y1]="grid.y.toFixed(1)"
                      [attr.x2]="grid.x2"
                      [attr.y2]="grid.y.toFixed(1)" />
                <text class="gns-line-chart__y-label"
                      [attr.x]="grid.labelX"
                      [attr.y]="grid.y.toFixed(1)"
                      text-anchor="end"
                      dominant-baseline="middle">{{ grid.label }}</text>
            }

            @for (grid of chart.gridV; track $index) {
                <line class="gns-line-chart__grid-v"
                      [attr.x1]="grid.x.toFixed(1)"
                      [attr.y1]="chart.paddingTop"
                      [attr.x2]="grid.x.toFixed(1)"
                      [attr.y2]="grid.y2" />
            }

            @for (s of chart.series; track $index) {
                @if (showArea()) {
                    <polygon class="gns-line-chart__area"
                             [attr.points]="s.areaPoints"
                             [attr.fill]="s.areaFill"
                             [attr.fill-opacity]="s.areaFillOpacity" />
                }

                <polyline class="gns-line-chart__line"
                          [class.gns-line-chart__line--animated]="isAnimated()"
                          [attr.points]="s.polylinePoints"
                          fill="none"
                          [attr.stroke]="s.color"
                          stroke-width="2"
                          stroke-linejoin="round"
                          stroke-linecap="round"
                          [style.--gns-line-length]="s.approxLength"
                          [style.--gns-line-delay]="s.animDelay" />

                @for (dot of s.dots; track $index) {
                    <circle class="gns-line-chart__dot"
                            [attr.cx]="dot.cx.toFixed(1)"
                            [attr.cy]="dot.cy.toFixed(1)"
                            r="4"
                            [attr.fill]="s.color"
                            stroke="var(--gns-color-bg-default,#fff)"
                            stroke-width="2">
                        <title>{{ dot.title }}</title>
                    </circle>
                }
            }

            @for (label of chart.xLabels; track $index) {
                <text class="gns-line-chart__x-label"
                      [attr.x]="label.x.toFixed(1)"
                      [attr.y]="label.y.toFixed(1)"
                      text-anchor="middle">{{ label.text }}</text>
            }
        </svg>
    } @else {
        <p class="gns-line-chart__empty">No data</p>
    }
</div>
