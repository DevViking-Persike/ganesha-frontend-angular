<div [class]="cssClass()" role="img" aria-label="Pie chart">
    @if (vm(); as pie) {
        <div class="gns-pie-chart__chart-wrap">
            <svg class="gns-pie-chart__svg"
                 [attr.width]="size()"
                 [attr.height]="size()"
                 [attr.viewBox]="'0 0 ' + size() + ' ' + size()"
                 xmlns="http://www.w3.org/2000/svg">

                @if (showGradient()) {
                    <defs>
                        @for (grad of pie.gradients; track grad.id) {
                            <linearGradient [attr.id]="grad.id" x1="0" x2="1" y1="0" y2="1">
                                <stop offset="0%" [attr.stop-color]="grad.baseColor" stop-opacity="1" />
                                <stop offset="100%" [attr.stop-color]="grad.baseColor" stop-opacity="0.65" />
                            </linearGradient>
                        }
                    </defs>
                }

                @for (slice of pie.slices; track $index) {
                    <path class="gns-pie-chart__slice"
                          [class.gns-pie-chart__slice--animated]="isAnimated()"
                          [attr.d]="slice.path"
                          [attr.fill]="slice.fill"
                          stroke="var(--gns-color-bg-card, #fff)"
                          stroke-width="2"
                          [style.--gns-pie-delay]="slice.animDelay"
                          [style.transform-origin]="pie.cx.toFixed(2) + 'px ' + pie.cy.toFixed(2) + 'px'">
                        <title>{{ slice.title }}</title>
                    </path>
                }
            </svg>
        </div>

        @if (showLegend()) {
            <ul class="gns-pie-chart__legend" role="list">
                @for (item of pie.legend; track $index) {
                    <li class="gns-pie-chart__legend-item">
                        <span class="gns-pie-chart__legend-dot" [style.background-color]="item.color" aria-hidden="true"></span>
                        <span class="gns-pie-chart__legend-label">{{ item.label }}</span>
                        <span class="gns-pie-chart__legend-pct">{{ item.pct }}%</span>
                    </li>
                }
            </ul>
        }
    } @else {
        <p class="gns-pie-chart__empty">No data</p>
    }
</div>
