<div [class]="cssClass()" role="search">

    <!-- ── Search input ────────────────────────────────────────────────── -->
    <div class="gns-search-filter__search">
        <!-- SVG icon overlaid via absolute positioning in CSS -->
        <span class="gns-search-filter__search-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M7 12A5 5 0 1 0 7 2a5 5 0 0 0 0 10zm4.243-.757 2.5 2.5"
                      stroke="currentColor"
                      stroke-width="1.5"
                      stroke-linecap="round"
                      stroke-linejoin="round" />
            </svg>
        </span>
        <gns-input-text
            [value]="searchValue()"
            (valueChange)="handleSearchChanged($event)"
            [placeholder]="resolvedPlaceholder()"
            additionalCssClass="gns-search-filter__input" />
    </div>

    <!-- ── Filter slots ────────────────────────────────────────────────── -->
    <div class="gns-search-filter__filters" #filtersSlot
         [style.display]="hasFilters() ? null : 'none'">
        <ng-content select="[filters]"></ng-content>
    </div>

    <!-- ── Right-side actions ──────────────────────────────────────────── -->
    <div class="gns-search-filter__actions" role="toolbar" aria-label="Toolbar actions"
         #actionsSlot [style.display]="hasActions() ? null : 'none'">
        <ng-content select="[actions]"></ng-content>
    </div>

</div>
