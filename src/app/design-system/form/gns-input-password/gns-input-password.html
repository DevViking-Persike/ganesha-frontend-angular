<div [class]="wrapperClass()">
  @if (label()?.trim()) {
    <label class="gns-input-password__label" [attr.for]="inputId">
      {{ label() }}
      @if (isRequired()) {
        <span class="gns-input-password__required" aria-hidden="true">*</span>
      }
    </label>
  }

  <div class="gns-input-password__control">
    @if (iconLeft()?.trim()) {
      <span
        class="gns-input-password__icon gns-input-password__icon--left {{ iconLeft() }}"
        aria-hidden="true"
      ></span>
    }

    <input
      [id]="inputId"
      [type]="inputType()"
      [class]="inputClass()"
      [value]="innerValue()"
      [attr.placeholder]="placeholder()"
      [disabled]="disabled()"
      [readOnly]="isReadOnly()"
      [required]="isRequired()"
      [attr.aria-required]="isRequired()"
      [attr.aria-invalid]="hasError()"
      [attr.aria-describedby]="describedBy()"
      (input)="handleInput($event)"
      (blur)="handleBlur()"
    />

    @if (showToggle()) {
      <button
        type="button"
        class="gns-input-password__toggle"
        [tabIndex]="disabled() ? -1 : 0"
        [attr.aria-label]="isVisible() ? 'Hide password' : 'Show password'"
        [attr.aria-pressed]="isVisible()"
        [disabled]="disabled()"
        (click)="toggleVisibility()"
      >
        <span [class]="toggleIconClass()" aria-hidden="true"></span>
      </button>
    }
  </div>

  @if (hasError()) {
    <span [id]="errorId" class="gns-input-password__error" role="alert">
      {{ errorMessage() }}
    </span>
  } @else if (helperText()?.trim()) {
    <span [id]="helperId" class="gns-input-password__helper">
      {{ helperText() }}
    </span>
  }
</div>
