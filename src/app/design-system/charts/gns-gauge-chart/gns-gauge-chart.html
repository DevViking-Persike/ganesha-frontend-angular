<div [class]="cssClass()" role="img" aria-label="Gauge chart">
    <svg class="gns-gauge__svg"
         [attr.width]="vm().size"
         [attr.height]="vm().halfSize"
         [attr.viewBox]="'0 0 ' + vm().size + ' ' + vm().halfSize"
         xmlns="http://www.w3.org/2000/svg">

        <defs>
            <linearGradient [attr.id]="bgGradId" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0%" stop-color="var(--gns-color-surface-raised, #ece7f4)" stop-opacity="0.55" />
                <stop offset="100%" stop-color="var(--gns-color-border-subtle, #d7d0e4)" stop-opacity="0.28" />
            </linearGradient>
            <linearGradient [attr.id]="fillGradId" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0%" [attr.stop-color]="startColor()" />
                <stop offset="100%" [attr.stop-color]="endColor()" />
            </linearGradient>
            <linearGradient [attr.id]="glossGradId" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.42" />
                <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.16" />
                <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
            </linearGradient>
            <filter [attr.id]="shadowFilterId" x="-20%" y="-20%" width="140%" height="160%">
                <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.18" />
            </filter>
        </defs>

        <path class="gns-gauge__track"
              [attr.d]="vm().trackPath"
              [attr.fill]="'url(#' + bgGradId + ')'" />

        @if (vm().pct > 0) {
            <g class="gns-gauge__fill-group"
               [class.gns-gauge__fill-group--animated]="isAnimated()">
                <path class="gns-gauge__fill"
                      [attr.d]="vm().fillPath"
                      [attr.fill]="'url(#' + fillGradId + ')'"
                      [attr.filter]="'url(#' + shadowFilterId + ')'" />

                <path class="gns-gauge__gloss"
                      [attr.d]="vm().glossPath"
                      [attr.fill]="'url(#' + glossGradId + ')'" />

                <path class="gns-gauge__highlight"
                      [attr.d]="vm().highlightPath"
                      fill="none"
                      stroke="rgba(255,255,255,0.34)"
                      stroke-width="2"
                      stroke-linecap="round" />
            </g>
        }

        <text class="gns-gauge__value"
              [attr.x]="vm().cx"
              [attr.y]="vm().valueY"
              text-anchor="middle"
              dominant-baseline="middle">{{ vm().valueText }}</text>

        @if (label()) {
            <text class="gns-gauge__label"
                  [attr.x]="vm().cx"
                  [attr.y]="vm().labelY"
                  text-anchor="middle"
                  dominant-baseline="middle">{{ label() }}</text>
        }

        <text class="gns-gauge__minmax"
              [attr.x]="12"
              [attr.y]="vm().minMaxY"
              text-anchor="start"
              dominant-baseline="middle">{{ minLabel() ?? '0' }}</text>

        <text class="gns-gauge__minmax"
              [attr.x]="vm().minMaxX"
              [attr.y]="vm().minMaxY"
              text-anchor="end"
              dominant-baseline="middle">{{ maxText() }}</text>
    </svg>
</div>
