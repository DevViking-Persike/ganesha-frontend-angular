<div [class]="cssClass()" role="img" aria-label="Bar chart">
    @if (vm(); as chart) {
        <svg class="gns-bar-chart__svg"
             [attr.viewBox]="'0 0 ' + chart.chartWidth + ' ' + chart.chartHeight"
             xmlns="http://www.w3.org/2000/svg"
             [attr.width]="chart.chartWidth"
             [attr.height]="chart.chartHeight">

            @for (grid of chart.gridLines; track $index) {
                <line class="gns-bar-chart__grid-line"
                      [attr.x1]="chart.paddingLeft"
                      [attr.y1]="grid.y.toFixed(1)"
                      [attr.x2]="grid.x2"
                      [attr.y2]="grid.y.toFixed(1)" />
                <text class="gns-bar-chart__y-label"
                      [attr.x]="grid.labelX"
                      [attr.y]="grid.y.toFixed(1)"
                      text-anchor="end"
                      dominant-baseline="middle">{{ grid.label }}</text>
            }

            @for (bar of chart.bars; track $index) {
                <g class="gns-bar-chart__bar-group">
                    <rect class="gns-bar-chart__hover-target"
                          [attr.x]="bar.x.toFixed(1)"
                          [attr.y]="chart.paddingTop.toFixed(1)"
                          [attr.width]="bar.width.toFixed(1)"
                          [attr.height]="chart.plotHeight.toFixed(1)"
                          fill="transparent" />
                    <rect class="gns-bar-chart__bar"
                          [class.gns-bar-chart__bar--animated]="isAnimated()"
                          [attr.x]="bar.x.toFixed(1)"
                          [attr.y]="bar.y.toFixed(1)"
                          [attr.width]="bar.width.toFixed(1)"
                          [attr.height]="bar.height.toFixed(1)"
                          rx="3"
                          ry="3"
                          [attr.fill]="bar.color"
                          [style.transform-origin]="bar.transformOrigin"
                          [style.--gns-bar-delay]="bar.animDelay">
                        <title>{{ bar.fullLabel }}: {{ bar.valueText }}</title>
                    </rect>

                    @if (showValues()) {
                        <text class="gns-bar-chart__value-label"
                              [attr.x]="bar.xCenter.toFixed(1)"
                              [attr.y]="(bar.y - 8).toFixed(1)"
                              text-anchor="middle">{{ bar.valueText }}</text>
                    }

                    @if (showLabels()) {
                        <text class="gns-bar-chart__x-label"
                              [attr.x]="bar.xCenter.toFixed(1)"
                              [attr.y]="(chart.paddingTop + chart.plotHeight + 22).toFixed(1)"
                              text-anchor="middle">{{ bar.labelText }}</text>
                    }
                </g>
            }
        </svg>
    } @else {
        <p class="gns-bar-chart__empty">No data</p>
    }
</div>
