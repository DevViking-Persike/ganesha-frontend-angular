<label [class]="cssClass()">
    <span class="gns-switch__track"
          role="switch"
          [tabindex]="isDisabled() ? -1 : 0"
          [attr.aria-checked]="value()"
          [attr.aria-disabled]="isDisabled()"
          [attr.aria-label]="label()"
          (click)="handleToggle()"
          (keydown)="handleKeyDown($event)">
        <span class="gns-switch__thumb"></span>
    </span>

    @if (label()) {
        <span class="gns-switch__label">{{ label() }}</span>
    }

    <input type="checkbox"
           class="gns-switch__input"
           [checked]="value()"
           [disabled]="isDisabled()"
           aria-hidden="true"
           tabindex="-1"
           (change)="handleChange($event)" />
</label>
