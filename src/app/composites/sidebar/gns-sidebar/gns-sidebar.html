<nav class="{{ cssClass() }}" aria-label="{{ ariaLabel() }}">

  <!-- ── Header / Brand ──────────────────────────────────────────────── -->
  <div class="gns-sidebar__header">
    @if (hasHeader()) {
      <ng-container [ngTemplateOutlet]="headerTpl()!" />
    } @else {
      <div class="gns-sidebar__brand">
        @if (brandLogoUrl()) {
          <img
            class="gns-sidebar__brand-logo"
            [src]="brandLogoUrl()"
            [attr.alt]="logoAlt()"
            [attr.aria-hidden]="logoAriaHidden()" />
        } @else {
          <span class="gns-sidebar__brand-icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="28" height="28" rx="6" fill="var(--gns-color-interactive-primary-bg)" />
              <path d="M7 14L13 20L21 8" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
        }
        @if (brandName()) {
          <span class="gns-sidebar__brand-name">{{ brandName() }}</span>
        }
      </div>
    }
  </div>

  <!-- ── Navigation Content ──────────────────────────────────────────── -->
  <div class="gns-sidebar__nav" role="list">
    <ng-content></ng-content>
  </div>

  <!-- ── Footer ──────────────────────────────────────────────────────── -->
  @if (hasFooter()) {
    <div class="gns-sidebar__footer">
      <ng-container [ngTemplateOutlet]="footerTpl()!" />
    </div>
  }

</nav>
